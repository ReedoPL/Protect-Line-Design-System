<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protect Line — slide template</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <link rel="stylesheet" href="../components/components.css">
  <style>
    .slide {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      margin: var(--spacing-xhg) auto;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--spacing-xxhg);
      position: relative;
    }
    .slide--navy { background: var(--color-navy); color: var(--color-white); }
    .slide--fair-blue { background: var(--color-fair-blue); color: var(--color-navy); }
    .slide__logo { position: absolute; top: var(--spacing-lg); left: var(--spacing-lg); height: 32px; }
    .slide__hugo { position: absolute; bottom: var(--spacing-lg); right: var(--spacing-lg); width: 48px; }
  </style>
</head>
<body style="background:#eee;padding:var(--spacing-xhg)">
  <h1 class="pl-h2" style="text-align:center;margin-bottom:var(--spacing-xhg)">Slide templates (16:9)</h1>

  <!-- Slide 1: Title -->
  <div class="slide slide--navy">
    <img src="../assets/logos/primary-logo-white-pink.png" alt="" class="slide__logo">
    <p class="pl-subheading-caps" style="color:var(--color-light-pink)">[Eyebrow]</p>
    <h1 class="pl-display" style="color:var(--color-white);max-width:700px">[Slide title in sentence case]</h1>
    <p class="pl-body" style="color:var(--color-light-pink);margin-top:var(--spacing-md);max-width:600px">[Subtitle — one line, warm and clear]</p>
    <img src="../assets/hugo/hugo-waving.png" alt="" class="slide__hugo">
  </div>

  <!-- Slide 2: Content -->
  <div class="slide slide--fair-blue">
    <img src="../assets/logos/primary-logo-navy-pink.png" alt="" class="slide__logo">
    <span class="pl-section-heading" style="margin-bottom:var(--spacing-lg)">[Section title]</span>
    <ul class="pl-body" style="max-width:700px;padding-left:var(--spacing-lg)">
      <li>[Key point 1 — sentence case]</li>
      <li>[Key point 2]</li>
      <li>[Key point 3]</li>
    </ul>
  </div>

  <!-- Slide 3: Quote -->
  <div class="slide slide--navy" style="text-align:center">
    <img src="../assets/logos/primary-logo-white-pink.png" alt="" class="slide__logo">
    <p class="pl-quote" style="color:var(--color-white);max-width:700px;margin:0 auto">"[Customer quote or key message]"</p>
    <p class="pl-body" style="color:var(--color-light-pink);margin-top:var(--spacing-lg)">— [Attribution]</p>
  </div>

  <!-- Slide 4: CTA -->
  <div class="slide slide--navy" style="text-align:center">
    <img src="../assets/logos/primary-logo-white-pink.png" alt="" class="slide__logo">
    <h2 class="pl-h1" style="color:var(--color-white)">[CTA headline]</h2>
    <a href="#" class="pl-btn pl-btn-primary" style="margin-top:var(--spacing-lg)">Get a quote</a>
    <p class="pl-body" style="color:var(--color-light-pink);margin-top:var(--spacing-md)">protectline.co.uk</p>
  </div>
</body>
</html>
